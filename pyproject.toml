[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "walter_rl"
version = "0.1.0"
description = "gen0 Walter full-body PD control in the flat, rough, and stairs scenes."
requires-python = ">=3.12,<3.14"
dependencies = [
  "mjlab",
]

[tool.uv.sources]
mjlab = { path = "mjlab", editable = true }
